<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FIFA World Cup 2026 Dashboard</title>

  <body>
    <h1>FIFA World Cup 2026 Dashboard</h1>
